name: linguakids_maroc
description: Application Flutter pour apprendre le français aux élèves du primaire marocain.

publish_to: "none"
version: 2.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  web: ^1.1.0  


    

  # ── Audio ─────────────────────────────────────
  speech_to_text: ^6.6.0
  flutter_tts: ^4.2.5
  permission_handler: ^12.0.1

  # ── Stockage local ────────────────────────────
  shared_preferences: ^2.3.2

  # ── Utilitaires ───────────────────────────────
  uuid: ^4.4.0
  connectivity_plus: ^6.1.0
  intl: ^0.19.0

  # ── Graphiques (tableau de bord enseignant) ───
  fl_chart: ^0.69.0

  # ── Firebase ──────────────────────────────────
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4

  # ── UI ────────────────────────────────────────
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/cp/
    - assets/images/ce1/
    - assets/images/ce2/
    - assets/images/cm1/
    - assets/images/cm2/
   